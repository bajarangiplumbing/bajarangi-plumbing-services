[project]
name = "project-plumb"
version = "0.1.0"
description = "Bajarangi Plumbing Services - Django backend for lead capture, admin, and staff notifications"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dj-database-url==3.1.2",
    "django==6.0.7",
    "django-otp>=1.7.3",
    "django-otp[qrcode]>=1.7.3",
    "gunicorn==26.0.0",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "sentry-sdk==2.66.1",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.12.0",
    "ruff==0.16.0",
]

[tool.ruff]
# PRD/ is specification, not source. Its Markdown contains fenced Python
# blocks, and `ruff format` will happily rewrite them - which would edit
# the documents the build is verified against. Excluded so that running
# `ruff format .` at the repo root can never touch them.
extend-exclude = ["PRD"]

[tool.ruff.lint.per-file-ignores]
# RUF012 (mutable-class-default) wants a ClassVar annotation on any
# mutable class attribute. That is right for ordinary classes, and
# core/views.py annotates its own `http_method_names` for exactly that
# reason - but it is wrong for Django's declarative API, where
# `class Meta: ordering = [...]`, `fields = [...]`, `list_filter = (...)`
# and `prepopulated_fields = {...}` are read by Django's metaclasses and
# are never mutated. The model and form declarations are also transcribed
# verbatim from backend_plan.md §6 and §7.1, so annotating them would put
# the code out of step with the document it is verified against.
# Migrations are generated by Django and rewritten wholesale on every
# `makemigrations`, so they cannot carry hand-edits at all.
"core/admin.py" = ["RUF012"]
"core/forms.py" = ["RUF012"]
"core/migrations/*.py" = ["RUF012"]
"core/models.py" = ["RUF012"]
